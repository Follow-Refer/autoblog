name: Fix Amazon Links

on:
  push:
    branches: [main]
    paths: [fix_links.py, link_checker.py]
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suffix: ['', '_ES', '_IN', '_KR']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fix links
        env:
          WP_URL:          ${{ secrets[format('WP_URL{0}', matrix.suffix)] }}
          WP_USERNAME:     ${{ secrets[format('WP_USERNAME{0}', matrix.suffix)] }}
          WP_APP_PASSWORD: ${{ secrets[format('WP_APP_PASSWORD{0}', matrix.suffix)] }}
        run: python fix_links.py
