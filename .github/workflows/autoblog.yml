name: AutoBlog Daily Publisher

on:
  schedule:
    - cron: '0 0 * * *'   # 오전 9시 KST
    - cron: '0 4 * * *'   # 오후 1시 KST
    - cron: '0 11 * * *'  # 오후 8시 KST
  workflow_dispatch:

jobs:
  publish-en:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run AutoBlog EN
        env:
          BLOG_LANG: en
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:            ${{ secrets.WP_URL }}
          WP_USERNAME:       ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:   ${{ secrets.WP_APP_PASSWORD }}
        run: python main.py

  publish-es:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run AutoBlog ES
        env:
          BLOG_LANG: es
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:            ${{ secrets.WP_URL_ES }}
          WP_USERNAME:       ${{ secrets.WP_USERNAME_ES }}
          WP_APP_PASSWORD:   ${{ secrets.WP_APP_PASSWORD_ES }}
        run: python main.py
