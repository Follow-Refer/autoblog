name: AutoBlog Daily Publisher

on:
  schedule:
    - cron: '17 14 * * *'   # 매일 1회 — 한국시간 밤 11시 17분 (미국 동부 아침)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-now']   # 이 파일을 바꾸면 즉시 1회 발행 (테스트용)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: en
            suffix: ''
          - lang: es
            suffix: '_ES'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Publish (${{ matrix.lang }})
        env:
          BLOG_LANG: ${{ matrix.lang }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:          ${{ secrets[format('WP_URL{0}', matrix.suffix)] }}
          WP_USERNAME:     ${{ secrets[format('WP_USERNAME{0}', matrix.suffix)] }}
          WP_APP_PASSWORD: ${{ secrets[format('WP_APP_PASSWORD{0}', matrix.suffix)] }}
        run: python main.py
